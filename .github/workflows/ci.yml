name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  greet-e2e:
    name: greet end-to-end (native, published moon* stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: mctl gen (run the published moonctl over greet.api)
        run: moon run --target native gen

      - name: moon check
        run: moon check --target native --deny-warn

      - name: moon build
        run: moon build --target native

      - name: moon test (HTTP @http e2e + SQLite persistence + gRPC reflection/SayHello over h2c)
        run: moon test --target native

      - name: e2e over the wire (a real HTTP client curls the running server)
        run: |
          set -euo pipefail
          moon run --target native cmd/greet-server &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- GET /ping ---"
          test "$(curl -sf http://127.0.0.1:8080/ping)" = "pong"
          echo "--- POST /users ---"
          CREATED=$(curl -sf -X POST http://127.0.0.1:8080/users --data '{"name":"Curl"}')
          echo "$CREATED"
          echo "$CREATED" | grep -q '"name":"Curl"'
          ID=$(echo "$CREATED" | grep -o '"id":[0-9]*' | grep -o '[0-9]*')
          echo "--- GET /users/$ID ---"
          curl -sf "http://127.0.0.1:8080/users/$ID" | grep -q '"name":"Curl"'
          echo "--- GET /openapi.json ---"
          DOC=$(curl -sf http://127.0.0.1:8080/openapi.json)
          echo "$DOC" | grep -q '"/ping"'
          echo "$DOC" | grep -q '"/users"'
          kill "$SRV" || true

      - name: lint (fmt is clean)
        run: |
          moon fmt
          git diff --exit-code

  gql:
    name: greet gql leg (native, separate module on moonasgi 0.5.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gql
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target native --deny-warn

      - name: moon build
        run: moon build --target native

      - name: moon test (a real @http client POSTs a query to /graphql over the wire)
        run: moon test --target native

      - name: lint (fmt is clean)
        run: |
          moon fmt
          git diff --exit-code
