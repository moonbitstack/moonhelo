name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master
  # Twice a month, so a new toolchain or a dependency's release shows up while nothing is pushed.
  schedule:
    - cron: "52 3 1,16 * *"
  workflow_dispatch:

jobs:
  greet:
    name: greet end-to-end (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      # The service is native-only, so every step names its target: this module
      # has no build for wasm, js or wasm-gc, and pretending otherwise would only
      # report failures of a target it never had.
      - name: mctl gen (the published moonctl over the spec)
        run: |
          moon run src/gen --target native
          moon fmt
          git diff --exit-code

      - name: moon check
        run: moon check --target native --deny-warn

      - name: moon build
        run: |
          moon build --target native
          # every annotation rule writes its output on each build, so after a
          # clean checkout any diff under src/ is a generated file that no longer
          # matches its input — which is the only way this can be caught cheaply
          git diff --exit-code -- src

      - name: moon test (REST over a socket, SQLite persistence, GraphQL, gRPC reflection)
        run: moon test --target native

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg"; then
              moon run "$dir" --target native
            fi
          done

      - name: e2e over the wire (curl and a Python client call the running server)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          moon run src/cmd/greet-server --target native &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:12000/ping >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- GET /ping ---"
          test "$(curl -sf http://127.0.0.1:12000/ping)" = "pong"
          echo "--- POST /users ---"
          CREATED=$(curl -sf -X POST http://127.0.0.1:12000/users --data '{"name":"Curl"}')
          echo "$CREATED"
          echo "$CREATED" | grep -q '"name":"Curl"'
          ID=$(echo "$CREATED" | grep -o '"id":[0-9]*' | grep -o '[0-9]*')
          echo "--- GET /users/$ID ---"
          curl -sf "http://127.0.0.1:12000/users/$ID" | grep -q '"name":"Curl"'
          echo "--- GET /openapi.json ---"
          DOC=$(curl -sf http://127.0.0.1:12000/openapi.json)
          echo "$DOC" | grep -q '"/ping"'
          echo "$DOC" | grep -q '"/users"'
          echo "--- POST /graphql ---"
          GQL=$(curl -sf -X POST http://127.0.0.1:12000/graphql -H 'content-type: application/json' --data '{"query":"{ greeting(name: \"Curl\") }"}')
          echo "$GQL"
          echo "$GQL" | grep -q '"greeting":"Hello, Curl"'
          echo "--- the same service from Python: HTTP, GraphQL, gRPC ---"
          python3 -m pip install --quiet --break-system-packages grpcio grpcio-tools
          python3 scripts/interop/python_clients.py
          kill "$SRV" || true

      # A reader pastes the blocks of the README into a project, so they have to
      # compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: the course pages are up to date
        if: runner.os == 'Linux'
        run: python3 scripts/gen_site.py --check

      # Every block on a page is a claim: a quoted one must still be a line of its
      # file, and a standalone one is compiled here with the context the page gives it.
      - name: the code on the course pages checks out
        if: runner.os == 'Linux'
        run: python3 scripts/check_site_code.py
